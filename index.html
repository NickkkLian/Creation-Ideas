// ============================================================
// 写作工作区 WRITING WORKSPACE
// 数据独立于 writing.json，存私有数据仓库的 writing-workspace.json。
// 分开的理由：文档正文 + 逐条版本历史体量远大于想法数据，
// 且完全不碰 writing.json 的 mergeData（那里加顶层键有剥键陷阱）。
// ⚠️ 公开壳零个人数据：本文件不得内嵌任何项目内容，空态只给提示。
// ============================================================
const WS_FILE = 'writing-workspace.json';
const WS_STATUS = { todo:'未写', draft:'草稿', done:'已定稿' };
const WS_STATUS_EN = { todo:'To write', draft:'Draft', done:'Final' };
const WS_MAX_VERSIONS = 20;
// 条目两类：internal＝内部素材（骨架/设定，不对外）；deliverable＝交付内容（对外可见）
// 🔒 规则：**导出一律只出交付内容**，交付清单才是要核对的工作量。
const WS_KIND = { internal:'内部', deliverable:'交付' };
const WS_KIND_EN = { internal:'Internal', deliverable:'Deliverable' };
const wsIsDeliv = t => (t.kind || 'deliverable') === 'deliverable';
const wsDelivTasks = p => (p.tasks || []).filter(wsIsDeliv);

function wsDefault() {
  return { _meta:{ version:'1.0', last_updated:new Date().toISOString() }, projects: [] };
}

function wsProj() {
  const ps = (state.ws && state.ws.projects) || [];
  return ps.find(p => p.id === state.wsProj) || ps[0] || null;
}

// ---------- 分区切换 ----------
function setZone(z) {
  state.zone = z;
  try { localStorage.setItem('writing_zone', z); } catch(e) {}
  document.body.classList.toggle('zone-writing', z === 'writing');
  document.querySelectorAll('.zone-tab').forEach(t => t.classList.toggle('active', t.dataset.zone === z));
  const hb = document.getElementById('ws-headbtns'), bb = document.getElementById('brain-headbtns');
  if (hb) hb.style.display = z === 'writing' ? '' : 'none';
  if (bb) bb.style.display = z === 'writing' ? 'none' : '';
  if (z === 'writing') {
    if (!state.ws) wsLoad(); else wsRender();
  }
}

// ---------- 数据读写 ----------
// 取一个 JSON 文件。文件超过 1MB 时 Contents API 不返回 content（encoding:"none"，
// 工作区体量一过线就整个读不出来，已真实触发过），这种时候改走 blob API（上限 100MB）。
async function wsFetchFile(file) {
  const { owner, repo } = state.settings;
  // 带时间戳绕开 Contents API 缓存——刚在别处写完就来读会拿到旧版本（菜谱那边踩过）
  const r = await githubGet(`/repos/${owner}/${repo}/contents/${file}?_=${Date.now()}`);
  if (r.status === 404) return { missing: true };
  if (!r.ok) return { error: 'HTTP ' + r.status };
  const json = await r.json();
  let b64 = json.content;
  if (!b64) {
    const br = await githubGet(`/repos/${owner}/${repo}/git/blobs/${json.sha}`);
    if (!br.ok) return { error: 'blob HTTP ' + br.status };
    b64 = (await br.json()).content || '';
  }
  try { return { data: JSON.parse(b64Decode(b64)), sha: json.sha }; }
  catch(e) { return { error: 'JSON ' + e.message }; }
}

// 外部项目：体量大又不常看的项目（归档）单独存一个文件，主文件里只留一个带 external 的壳，
// 点开才拉正文。主文件因此不会被归档撑大。
async function wsLoadExt(p) {
  if (!p || !p.external || p._loaded) return !!(p && p._loaded);
  const file = p.external;
  const rec = state.wsExt[file] = state.wsExt[file] || {};
  if (rec.loading) return rec.loading;   // 渲染和点击可能同时来要，共用一个在途请求
  setSyncStatus('syncing', T('载入归档...','Loading archive...'));
  rec.loading = (async () => {
    const got = await wsFetchFile(file);
    if (got.error) { setSyncStatus('error', T('归档读取失败: ','Archive load failed: ') + got.error); return false; }
    const proj = got.missing ? {} : (got.data.project || got.data);
    p.docs  = Array.isArray(proj.docs)  ? proj.docs  : [];
    p.tasks = Array.isArray(proj.tasks) ? proj.tasks : [];
    p._loaded = true;
    rec.sha = got.missing ? null : got.sha;
    rec.snapshot = JSON.stringify({ docs: p.docs, tasks: p.tasks });
    setSyncStatus('idle', T('已同步','Synced'));
    return true;
  })();
  try { return await rec.loading; } finally { rec.loading = null; }
}

async function wsLoad() {
  if (!hasSettings()) { state.ws = wsDefault(); wsRender(); return false; }
  setSyncStatus('syncing', T('读取工作区...','Loading workspace...'));
  try {
    const got = await wsFetchFile(WS_FILE);
    if (got.missing) { state.ws = wsDefault(); state.wsSha = null; setSyncStatus('idle', T('工作区为空','Workspace empty')); wsRender(); return true; }
    if (got.error) { state.ws = wsDefault(); setSyncStatus('error', T('工作区读取失败','Workspace load failed')); wsRender(); return false; }
    const parsed = got.data;
    state.ws = { _meta: parsed._meta || wsDefault()._meta, projects: Array.isArray(parsed.projects) ? parsed.projects : [] };
    state.wsExt = {};
    state.wsSha = got.sha;
    if (!state.wsProj && state.ws.projects[0]) state.wsProj = state.ws.projects[0].id;
    setSyncStatus('success', T('已同步','Synced'));
    setTimeout(() => setSyncStatus('idle', T('已同步','Synced')), 1800);
    wsRender();
    return true;
  } catch(e) {
    state.ws = wsDefault(); setSyncStatus('error', T('网络错误','Network error')); console.error(e); wsRender(); return false;
  }
}

async function wsSave(silent, _retrying = false) {
  if (!hasSettings()) { setSyncStatus('error', T('未配置令牌','No token')); return false; }
  if (state.wsSaving && !_retrying) {
    if (state.wsTimer) clearTimeout(state.wsTimer);
    state.wsTimer = setTimeout(() => wsSave(false), 1500);
    return false;
  }
  state.wsSaving = true;
  if (!silent) setSyncStatus('syncing', T('保存中...','Saving...'));
  try {
    state.ws._meta.last_updated = new Date().toISOString();
    const content = b64Encode(JSON.stringify(wsMainPayload(), null, 1));
    const { owner, repo } = state.settings;
    const body = { message: `Update ${WS_FILE} - ${new Date().toLocaleString('zh-CN')}`, content,
                   ...(state.wsSha ? { sha: state.wsSha } : {}) };
    const r = await githubPut(`/repos/${owner}/${repo}/contents/${WS_FILE}`, body);
    if ((r.status === 409 || r.status === 422) && !_retrying) {
      setSyncStatus('syncing', T('SHA冲突，重取...','SHA conflict, retrying...'));
      const rf = await githubGet(`/repos/${owner}/${repo}/contents/${WS_FILE}`);
      state.wsSha = rf.ok ? (await rf.json()).sha : null;
      state.wsSaving = false;
      return wsSave(silent, true);
    }
    if (!r.ok) {
      let m = r.status; try { m = (await r.json()).message || m; } catch(e) {}
      setSyncStatus('error', T('保存失败: ','Save failed: ') + m);
      state.wsSaving = false; return false;
    }
    state.wsSha = (await r.json()).content.sha;
    state.wsSaving = false;
    for (const ep of state.ws.projects) if (ep.external && ep._loaded) await wsSaveExt(ep);
    if (!silent) { setSyncStatus('success', T('已保存','Saved')); setTimeout(() => setSyncStatus('idle', T('已同步','Synced')), 1800); }
    wsDelivSync();          // 已放入交付的项跟着刷新——链接不变，内容始终是最新的
    return true;
  } catch(e) {
    setSyncStatus('error', T('保存失败','Save failed')); state.wsSaving = false; console.error(e); return false;
  }
}

// 主文件里的外部项目只留壳（docs/tasks 清空，external 保留）；
// _loaded 是内存标记，哪个文件都不写进去。
function wsMainPayload() {
  return {
    _meta: state.ws._meta,
    projects: (state.ws.projects || []).map(p => {
      if (!p.external) return p;
      const { docs, tasks, _loaded, ...shell } = p;
      return { ...shell, docs: [], tasks: [] };
    })
  };
}

async function wsSaveExt(p, _retrying = false) {
  const file = p.external;
  const rec = state.wsExt[file] = state.wsExt[file] || {};
  const cur = JSON.stringify({ docs: p.docs || [], tasks: p.tasks || [] });
  if (rec.snapshot === cur) return true;          // 没改就不写，省一个空提交
  const { _loaded, ...proj } = p;
  const payload = { _meta: { version: '1.0', last_updated: new Date().toISOString() }, project: proj };
  const { owner, repo } = state.settings;
  const body = { message: `Update ${file} - ${new Date().toLocaleString('zh-CN')}`,
                 content: b64Encode(JSON.stringify(payload, null, 1)),
                 ...(rec.sha ? { sha: rec.sha } : {}) };
  const r = await githubPut(`/repos/${owner}/${repo}/contents/${file}`, body);
  if ((r.status === 409 || r.status === 422) && !_retrying) {
    const rf = await githubGet(`/repos/${owner}/${repo}/contents/${file}`);
    rec.sha = rf.ok ? (await rf.json()).sha : null;
    return wsSaveExt(p, true);
  }
  if (!r.ok) { setSyncStatus('error', T('归档保存失败','Archive save failed')); return false; }
  rec.sha = (await r.json()).content.sha; rec.snapshot = cur;
  return true;
}

function wsScheduleSave() {
  setSyncStatus('unsaved', T('未保存','Unsaved'));
  if (state.wsTimer) clearTimeout(state.wsTimer);
  if (hasSettings()) state.wsTimer = setTimeout(() => wsSave(false), 2000);
}

// ---------- 渲染主入口 ----------
function wsRender() {
  const root = document.getElementById('ws-root');
  if (!root) return;
  const ws = state.ws;
  if (!ws) { root.innerHTML = `<div class="ws-empty"><div class="big">✍️</div><p>${T('加载中…','Loading…')}</p></div>`; return; }
  if (!ws.projects.length) {
    root.innerHTML = `<div class="ws-empty"><div class="big">✍️</div>
      <p>${T('还没有写作项目。','No writing project yet.')}<br>
      ${T('写作项目用来放长期的写作工程：设定文档 + 逐条写作清单 + 版本与交付导出。','A writing project holds long-form work: reference docs, a per-item checklist, versions and delivery exports.')}</p>
      <div style="margin-top:18px"><button class="ws-btn primary" onclick="wsNewProject()">＋ ${T('新建写作项目','New project')}</button></div>
      ${hasSettings() ? '' : `<p class="ws-hint">${T('提示：先在「⚙ 设置」里配置令牌，数据才会同步。','Tip: configure the token in Settings to enable sync.')}</p>`}</div>`;
    return;
  }
  const p = wsProj();
  const tabs = [['tasks','📋 '+T('写作清单','Checklist')],['docs','📄 '+T('设定文档','Docs')],['export','⬇ '+T('导出','Export')]];
  const st = wsStats(p);
  const sk = wsStats(p, (p.tasks||[]).filter(t => !wsIsDeliv(t)));
  root.innerHTML = `
    <div class="ws-projbar">
      <select class="ws-proj-sel" onchange="wsSetProject(this.value)">
        ${ws.projects.map(x => `<option value="${escHtml(x.id)}" ${x.id===p.id?'selected':''}>${escHtml(x.name)}</option>`).join('')}
      </select>
      <div class="ws-proj-desc">${escHtml(p.desc||'')}</div>
      <div class="ws-progwrap">
        <div class="ws-progbar"><i style="width:${st.pct}%"></i></div>
        <div class="ws-progtxt">${T('交付','Deliverable')} ${st.done}/${st.total} · ${st.pct}%${
          sk.total ? ` <span style="color:var(--w-tx3)">｜${T('骨架','Skeleton')} ${sk.done}/${sk.total}</span>` : ''}</div>
      </div>
      <button class="ws-btn ghost" onclick="wsNewProject()" title="${T('新建写作项目','New project')}">＋</button>
    </div>
    <div class="ws-tabs">${tabs.map(([k,l]) => `<button class="ws-tab ${state.wsTab===k?'active':''}" onclick="wsSetTab('${k}')">${l}</button>`).join('')}</div>
    <div id="ws-view"></div>`;
  const v = document.getElementById('ws-view');
  if (p.external && !p._loaded) {          // 壳还没展开：占位，拉完自然重绘
    v.innerHTML = `<div class="ws-empty"><div class="big">📦</div><p>${T('正在载入归档…','Loading archive…')}</p></div>`;
    wsLoadExt(p).then(ok => { if (ok) wsRender(); });
    return;
  }
  if (state.wsTab === 'docs') wsRenderDocs(v, p);
  else if (state.wsTab === 'export') wsRenderExport(v, p);
  else wsRenderTasks(v, p);
}

function wsStats(p, list) {
  const ts = list || wsDelivTasks(p);   // 默认只统计交付＝真正的工作量
  const done = ts.filter(t => t.status === 'done').length;
  const draft = ts.filter(t => t.status === 'draft').length;
  return { total: ts.length, done, draft, todo: ts.length - done - draft,
           pct: ts.length ? Math.round(done / ts.length * 100) : 0 };
}
function wsSetProject(id) { state.wsProj = id; state.wsGroup = null; state.wsDoc = null; wsRender(); }
function wsSetTab(t) { state.wsTab = t; wsRender(); if ((t === 'export' || t === 'docs') && !state.deliv) wsDelivLoad(); }

// ---------- 写作清单 ----------
function wsTaskText(t) { return (t.fields || []).map(f => f.value || '').join(' ').trim(); }
function wsTaskOld(t)  { return (t.fields || []).map(f => f.old || '').join(' ').trim(); }
function wsChanged(t) {
  if (!t.exported) return !!wsTaskText(t);
  return (t.fields || []).some(f => (t.exported[f.key] || '') !== (f.value || ''));
}

function wsRenderTasks(el, p) {
  const tasks = p.tasks || [];
  if (!tasks.length) {
    el.innerHTML = `<div class="ws-empty"><div class="big">📋</div><p>${T('这个项目还没有写作条目。','No checklist items yet.')}</p></div>`;
    return;
  }
  const groups = [];
  for (const t of tasks) if (!groups.includes(t.group)) groups.push(t.group);
  if (!state.wsGroup || !groups.includes(state.wsGroup)) state.wsGroup = groups[0];

  const side = groups.map(g => {
    const gt = tasks.filter(t => t.group === g);
    const d = gt.filter(t => t.status === 'done').length;
    const isInt = gt.length && !wsIsDeliv(gt[0]);
    return `<button class="ws-slink ${state.wsGroup===g?'active':''}" onclick="wsSetGroup(${JSON.stringify(g).replace(/"/g,'&quot;')})">
      <span>${escHtml(g)}${isInt ? ` <span style="font-size:.72rem;color:var(--w-tx3)">${T('内部','int')}</span>` : ''}</span><span class="n">${d}/${gt.length}</span></button>`;
  }).join('');

  const q = (state.wsQuery || '').trim().toLowerCase();
  let list = tasks.filter(t => t.group === state.wsGroup);
  if (state.wsFilter && state.wsFilter !== 'all') list = list.filter(t => t.status === state.wsFilter);
  if (state.wsKind && state.wsKind !== 'kall') list = list.filter(t => (t.kind||'deliverable') === state.wsKind);
  if (q) list = list.filter(t => (t.title + ' ' + t.sub + ' ' + wsTaskText(t) + ' ' + wsTaskOld(t)).toLowerCase().includes(q));

  const chips = [['all',T('全部','All')],['todo',T('未写','To write')],['draft',T('草稿','Draft')],['done',T('已定稿','Final')]]
    .map(([k,l]) => `<button class="ws-chip ${(state.wsFilter||'all')===k?'active':''}" onclick="wsSetFilter('${k}')">${l}</button>`).join('')
    + `<span style="width:10px"></span>` +
    [['kall',T('不限','Any')],['deliverable','📦 '+T('交付','Deliv')],['internal','🔒 '+T('内部','Int')]]
    .map(([k,l]) => `<button class="ws-chip ${(state.wsKind||'kall')===k?'active':''}" onclick="wsSetKind('${k}')">${l}</button>`).join('');

  let body = '';
  let lastSub = null;
  for (const t of list) {
    if (t.sub !== lastSub) { body += `<div class="ws-subhead">${escHtml(t.sub || '')}</div>`; lastSub = t.sub; }
    body += wsTaskCard(t);
  }
  if (!list.length) body = `<div class="ws-empty"><p>${T('没有符合条件的条目。','Nothing matches.')}</p></div>`;

  el.innerHTML = `<div class="ws-body">
    <div class="ws-side">${side}</div>
    <div class="ws-main">
      <div class="ws-filter">${chips}
        <input class="ws-search" placeholder="${T('搜索标题或正文…','Search…')}" value="${escHtml(state.wsQuery||'')}"
               oninput="wsSetQuery(this.value)">
      </div>
      ${body}
    </div></div>`;
}

function wsTaskCard(t) {
  const open = state.wsOpenTask === t.id;
  const txt = wsTaskText(t);
  const prev = txt || wsTaskOld(t);
  const chg = wsChanged(t) && t.exportedAt;
  return `<div class="ws-task ${open?'open':''}" id="wst-${t.id}">
    <div class="ws-thead" onclick="wsToggleTask('${t.id}')">
      <div class="ws-ttitle">${escHtml(t.title)}
        <div class="ws-tprev">${prev ? escHtml(prev.slice(0,70)) + (prev.length>70?'…':'') : T('（空）','(empty)')}</div>
      </div>
      ${wsIsDeliv(t) ? '' : `<span class="ws-badge int">${lang==='en'?WS_KIND_EN.internal:WS_KIND.internal}</span>`}
      ${chg && wsIsDeliv(t) ? `<span class="ws-badge chg">${T('待交付','Pending')}</span>` : ''}
      <span class="ws-badge ${t.status}">${lang==='en'?WS_STATUS_EN[t.status]:WS_STATUS[t.status]}</span>
    </div>
    ${open ? wsTaskBody(t) : ''}
  </div>`;
}

function wsTaskBody(t) {
  const ctx = (t.context||[]).length ? `<details class="ws-ctx" open><summary>${T('写作上下文（只读）','Context (read-only)')}</summary>
      <table class="ws-ctxtable">${t.context.map(c => `<tr><td>${escHtml(c.k)}</td><td>${escHtml(c.v)}</td></tr>`).join('')}</table>
    </details>` : '';
  const fields = (t.fields||[]).map((f,i) => `
    <div class="ws-field">
      ${f.old ? `<div class="ws-old"><span class="lbl">${T('旧占位文案（ChatGPT 生成，只作语感参考，不是范本）','Old placeholder — reference only, not a template')}</span>${escHtml(f.old)}</div>` : ''}
      <div class="ws-flabel"><span>${escHtml(f.label)}</span><span class="cnt" id="cnt-${t.id}-${i}">${(f.value||'').length} ${T('字','ch')}</span></div>
      ${f.key==='title'
        ? `<input class="ws-input" id="fi-${t.id}-${i}" value="${escHtml(f.value||'')}" oninput="wsFieldInput('${t.id}',${i},this.value)">`
        : `<textarea class="ws-textarea" id="fi-${t.id}-${i}" oninput="wsFieldInput('${t.id}',${i},this.value)" placeholder="${T('两三句。别超过三句。','Two or three sentences.')}">${escHtml(f.value||'')}</textarea>`}
    </div>`).join('');
  const vers = (t.versions||[]).length ? `<details class="ws-vers"><summary>${T('版本历史','Versions')}（${t.versions.length}）</summary>
      ${t.versions.slice().reverse().map(v => `<div class="ws-vrow">
        <span class="vno">v${v.v}</span>
        <span class="vtx">${escHtml(Object.values(v.fields||{}).filter(Boolean).join(' ／ ')||'（空）')}</span>
        <span class="vat">${escHtml((v.at||'').replace('T',' ').slice(0,16))}</span>
        <button class="ws-btn ghost" style="padding:2px 8px" onclick="wsRestore('${t.id}',${v.v})">${T('回填','Restore')}</button>
      </div>`).join('')}</details>` : '';
  return `<div class="ws-tbody">
    ${ctx}${fields}
    ${t.note !== undefined ? `<div class="ws-field"><div class="ws-flabel"><span>${T('我的备注（不导出）','My note (not exported)')}</span></div>
      <input class="ws-input" value="${escHtml(t.note||'')}" oninput="wsNoteInput('${t.id}',this.value)"></div>` : ''}
    <div class="ws-actions">
      ${['todo','draft','done'].map(s => `<button class="ws-btn ${t.status===s?'primary':''}" onclick="wsSetStatus('${t.id}','${s}')">${lang==='en'?WS_STATUS_EN[s]:WS_STATUS[s]}</button>`).join('')}

function wsCommit(id) {
  const t = wsFindTask(id); if (!t) return;
  const cur = {}; (t.fields||[]).forEach(f => cur[f.key] = f.value || '');
  const last = (t.versions||[])[t.versions.length - 1];
  if (last && JSON.stringify(last.fields) === JSON.stringify(cur)) {
    setSyncStatus('idle', T('与上一版相同，未新增','Same as last version')); return;
  }
  t.versions = t.versions || [];
  t.versions.push({ v: (last ? last.v : 0) + 1, fields: cur, at: new Date().toISOString() });
  if (t.versions.length > WS_MAX_VERSIONS) t.versions = t.versions.slice(-WS_MAX_VERSIONS);
  wsScheduleSave(); wsRender();
  setSyncStatus('success', T('已存为 v','Saved as v') + t.versions[t.versions.length-1].v);
}
function wsRestore(id, v) {
  const t = wsFindTask(id); if (!t) return;
  const ver = (t.versions||[]).find(x => x.v === v); if (!ver) return;
  (t.fields||[]).forEach(f => { if (ver.fields[f.key] !== undefined) f.value = ver.fields[f.key]; });
  wsScheduleSave(); wsRender();
}

// ---------- 归档 / 取回 ----------
// 归档 ≠ 删除：文档搬进「<项目名> · 归档」这个独立项目，主项目的列表从此看不到它。
// 归档项目是外部文件（点开才加载），所以主文件不会被归档撑大。
// 命令行同款：wanderpaw/归档文档.py（同一套 archivedFrom 语义，两边可互相取回）。
const WS_ARCH_SUFFIX = ' · 归档';
function wsIsArchive(p) { return !!(p && p.name && p.name.endsWith(WS_ARCH_SUFFIX)); }
function wsArchiveOf(p) {
  const nm = p.name + WS_ARCH_SUFFIX;
  return (state.ws.projects || []).find(x => x.name === nm) || null;

function wsMainOf(ap) {
  const nm = ap.name.slice(0, -WS_ARCH_SUFFIX.length);

// 壳（external 且未加载）必须先展开再往里搬。否则 p.docs 在内存里只有刚搬进去的这一条，
// 而 wsSave 又只保存 _loaded 的外部项目——文档会从主项目消失且没写进归档文件，直接丢。
async function wsExpand(p) {
  if (!p.external || p._loaded) return true;
  const ok = await wsLoadExt(p);
  if (!ok) alert(T('归档文件没读出来，这次不搬，先看同步状态。','Archive file failed to load; nothing moved.'));

  const d = (p.docs || []).find(x => x.id === state.wsDoc); if (!d) return;
  if (!confirm(T(`把《${d.title}》归档？\n\n它会搬进「${p.name}${WS_ARCH_SUFFIX}」，主项目里不再显示。\n不是删除，随时可以取回。`,
                 `Archive "${d.title}"? It moves to "${p.name}${WS_ARCH_SUFFIX}". Not a delete — restorable anytime.`))) return;
  let ap = wsArchiveOf(p);
  if (!ap) {
    ap = { id: 'p_' + Date.now().toString(36), name: p.name + WS_ARCH_SUFFIX, nameEn: p.name + ' (Archive)',
           desc: T('从主项目搬出来的文档。只搬不删，随时可取回。','Docs moved out of the main project. Restorable anytime.'),
           createdAt: new Date().toISOString(),
           external: 'writing-workspace-archive-' + p.id + '.json',
           docs: [], tasks: [], _loaded: true };
    state.ws.projects.push(ap);
  } else if (!await wsExpand(ap)) return;
  d.archivedFrom = d.group; d.group = T('归档','Archive');
  p.docs.splice(p.docs.indexOf(d), 1);
  (ap.docs = ap.docs || []).push(d);

}
async function wsUnarchiveDoc() {
  const ap = wsProj(); if (!ap || !wsIsArchive(ap)) return;
  const d = (ap.docs || []).find(x => x.id === state.wsDoc); if (!d) return;
  const mp = wsMainOf(ap);
  if (!mp) { alert(T('找不到它原来的项目（可能改过名），没取回。','Original project not found; nothing moved.')); return; }

  ap.docs.splice(ap.docs.indexOf(d), 1);
  (mp.docs = mp.docs || []).push(d);
  state.wsDoc = (ap.docs[0] || {}).id || null;
  wsScheduleSave(); wsRender();
}

// ---------- 精简 Markdown 渲染 ----------
function wsMd(src) {
  const lines = String(src).replace(/\r/g,'').split('\n');
  let out = '', i = 0;
  const inline = s => escHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    if (/^```/.test(l)) { let b = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) b += lines[i++] + '\n'; i++;
      out += `<pre style="background:var(--w-surf3);padding:12px;border-radius:7px;overflow-x:auto"><code>${escHtml(b)}</code></pre>`; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length, 4); out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])) {
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
      const head = cells(l); i += 2; let rows = '';
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
      out += `<div class="ws-mdtable"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    if (/^\s*>/.test(l)) { let b = ''; while (i < lines.length && /^\s*>/.test(lines[i])) b += lines[i++].replace(/^\s*>\s?/,'') + '\n';
      out += `<blockquote>${b.split('\n').filter(Boolean).map(x => `<p>${inline(x)}</p>`).join('')}</blockquote>`; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ord = /^\s*\d+\./.test(l); let items = '';
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/,''))}</li>`;
      out += ord ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
    }
    let par = '';
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*\||```)/.test(lines[i])) par += lines[i++] + ' ';
    if (par.trim()) out += `<p>${inline(par.trim())}</p>`; else i++;
  }
  return out;
}

// ---------- 字符级 diff（中文按字比对） ----------
function wsDiff(a, b) {
  a = String(a||''); b = String(b||'');
  if (a === b) return [[0, a]];
  if (a.length * b.length > 250000) return [[-1, a], [1, b]];
  const A = [...a], B = [...b], n = A.length, m = B.length;
  const dp = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for (let x = n-1; x >= 0; x--) for (let y = m-1; y >= 0; y--)
    dp[x][y] = A[x] === B[y] ? dp[x+1][y+1] + 1 : Math.max(dp[x+1][y], dp[x][y+1]);
  const res = []; let x = 0, y = 0;
  const push = (op, ch) => { if (res.length && res[res.length-1][0] === op) res[res.length-1][1] += ch; else res.push([op, ch]); };
  while (x < n && y < m) {
    if (A[x] === B[y]) { push(0, A[x]); x++; y++; }
    else if (dp[x+1][y] >= dp[x][y+1]) { push(-1, A[x]); x++; }
    else { push(1, B[y]); y++; }
  }
  while (x < n) push(-1, A[x++]);
  while (y < m) push(1, B[y++]);
  return res;
}
function wsDiffMark(a, b) {
  return wsDiff(a, b).map(([op, s]) => op === 0 ? s : op === 1 ? `【+${s}】` : `【-${s}】`).join('');
}

// ---------- 交付（放入交付 → 团队用带码链接只读查看）----------
// 写入端用**本人的 PAT** 写私有库 delivery-inbox；读取端由 Cloudflare Function 代理，
// 那把 token 只需 Contents: Read。**没点过「放入交付」的东西根本不在那个库里**——
// 不是靠过滤挡住，是它压根不在那儿。
const DELIV_REPO = 'delivery-inbox';
const DELIV_SITE = 'https://personal-hub-7uc.pages.dev';   // 交付链接的站点；换域名时同步改这里

async function delivGet(path) {
  const { owner, token } = state.settings;
  const r = await fetch(`${GITHUB_API}/repos/${owner}/${DELIV_REPO}/contents/${path}?_=${Date.now()}`, {
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
  if (!r.ok) {
    let msg = ''; try { msg = (await r.json()).message || ''; } catch(e) {}
    return { data: null, sha: null, status: r.status, msg };
  }
  const j = await r.json();
  try { return { data: JSON.parse(b64Decode(j.content)), sha: j.sha, status: 200 }; }
  catch { return { data: null, sha: j.sha, status: 200 }; }
}
// 把 GitHub 的原始状态翻译成能直接照做的一句话。
// ⚠️ 最常见的原因：app 用的这把令牌是按仓库授权的，只圈了主数据仓库，够不到 delivery-inbox。
function delivWhy(status, msg) {
  if (status === 404) return T('令牌看不到 delivery-inbox 仓库（多半是这把令牌没把它勾进授权范围）','Token cannot see delivery-inbox');
  if (status === 403) return T('令牌没有 delivery-inbox 的权限','Token lacks permission on delivery-inbox');
  if (status === 401) return T('令牌无效或已过期','Token invalid or expired');
  if (status === 422) return T('文件版本冲突，请再点一次','Version conflict, click again');
  return `${status}${msg ? ' · ' + msg : ''}`;
}
async function delivPut(path, obj, sha, msg) {
  const { owner, token } = state.settings;
  const body = { message: msg, content: b64Encode(JSON.stringify(obj, null, 2)), ...(sha ? { sha } : {}) };
  const r = await fetch(`${GITHUB_API}/repos/${owner}/${DELIV_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json',
               'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  return r;
}
function delivFile(p) { return `${p.id}/delivery.json`; }

// 按**当前**数据生成一个交付项。放入交付时用它，之后每次保存也用它重建——
// 所以「放入交付」＝订阅这一项，链接会一直跟着最新内容走，团队不用换链接。
// keep：交付项被手动改过名时传进来，自动跟随时不要把名字覆盖回文档标题
function delivBuild(p, kind, id, keep) {
  if (kind === 'doc') {
    const d = (p.docs || []).find(x => x.id === id);
    return d ? { id, kind: 'doc', title: keep || d.title, body: d.body || '', ...(keep ? { renamed: true } : {}) } : null;
  }
  if (kind === 'list') {
    const ts = wsDelivTasks(p), st = wsStats(p);
    const ST = { todo:'未写', draft:'草稿', done:'已定稿' };
    // 每个大分组单独一张表——207 行堆成一张表没法看
    const names = [...new Set(ts.map(t => t.group))];
    const groups = names.map(g => {
      const gt = ts.filter(t => t.group === g);
      const done = gt.filter(t => t.status === 'done').length;
      const draft = gt.filter(t => t.status === 'draft').length;
      return { name: g,
        summary: `${gt.length} 条 · 已定稿 ${done} · 草稿 ${draft} · 未写 ${gt.length - done - draft}`,
        rows: gt.map(t => ({ 子组:t.sub, 条目:t.title, 状态:ST[t.status],
          内容:(t.fields||[]).filter(f=>f.value).map(f=>`${f.label}：${f.value}`).join('　') })) };
    });
    return { id, kind: 'list', title: keep || `${p.name}｜交付清单`, ...(keep ? { renamed: true } : {}),
      summary: `共 ${st.total} 条 · 已定稿 ${st.done} · 草稿 ${st.draft} · 未写 ${st.todo} · 完成度 ${st.pct}%`,
      columns: ['子组','条目','状态','内容'],      // 分组已成表头，不再占一列
      groups };
  }
  return null;
}

// 每次保存后把已放入交付的那几项按最新数据刷一遍。内容没变就不写，避免无谓提交。
let _delivSyncing = false;
async function wsDelivSync() {
  if (_delivSyncing) return;
  const p = wsProj();
  if (!p || !hasSettings() || !state.deliv || !(state.deliv.items || []).length) return;
  if (state.delivErr) return;                       // 上次就够不到那个仓库，别反复刷错误
  const fresh = state.deliv.items.map(it => delivBuild(p, it.kind, it.id, it.renamed ? it.title : null) || it);
  if (JSON.stringify(fresh) === JSON.stringify(state.deliv.items)) return;   // 没变
  _delivSyncing = true;
  try {
    const cur = await delivGet(delivFile(p));
    if (cur.status !== 200 && cur.status !== 404) { state.delivErr = delivWhy(cur.status, cur.msg); return; }
    state.delivSha = cur.sha;
    state.deliv.items = fresh;
    state.deliv.updatedAt = new Date().toISOString();
    const r = await delivPut(delivFile(p), state.deliv, state.delivSha, `deliver(${p.id}): 跟随更新`);
    if (r.ok) state.delivSha = (await r.json()).content.sha;
  } finally { _delivSyncing = false; }
}

// 手动刷新交付内容。
// 为什么要有它：wsDelivSync 只挂在 app 内的保存流程上，而文档也可能被 app 之外改动
// （比如在 app 之外直接写数据文件），那种改动不经过 wsSave，链接就会静静停在旧版本。
// 顺序不能反：**先把工作区拉成最新，再刷交付**——否则等于拿浏览器里的旧内容去覆盖链接。
async function wsDelivRefresh() {
  if (!hasSettings()) { showSettings(); return; }
  setSyncStatus('syncing', T('刷新交付内容…','Refreshing…'));
  if (!(await wsLoad())) return;                    // 拉不到最新就停，wsLoad 自己已经报过错
  if (!(await wsDelivLoad(true))) { setSyncStatus('error', state.delivErr); wsRender(); return; }
  const before = JSON.stringify(state.deliv.items || []);
  await wsDelivSync();
  if (state.delivErr) { setSyncStatus('error', state.delivErr); wsRender(); return; }
  const changed = JSON.stringify(state.deliv.items || []) !== before;
  setSyncStatus('success', changed ? T('链接内容已更新','Link updated') : T('链接已是最新','Already up to date'));
  setTimeout(() => setSyncStatus('idle', T('已同步','Synced')), 2000);
  wsRender();
}

async function wsDelivLoad(silent) {
  const p = wsProj(); if (!p || !hasSettings()) return false;
  const [d, k] = await Promise.all([delivGet(delivFile(p)), delivGet('keys.json')]);
  // ⚠️ 读不到就必须停下。此前的 bug：读失败时 sha 为 null，代码却继续拿 null 去 PUT
  // 一个已存在的文件 → GitHub 必然 422，于是「读失败」被伪装成了「写失败」。
  const bad = [d, k].find(x => x.status !== 200 && x.status !== 404);
  if (bad) {
    state.delivErr = delivWhy(bad.status, bad.msg);
    if (!silent) wsRender();
    return false;
  }
  state.delivErr = null;
  state.deliv = (d.data && Array.isArray(d.data.items)) ? d.data : { project: p.name, updatedAt: null, items: [] };
  state.delivSha = d.sha; state.delivKeys = k.data || {}; state.delivKeysSha = k.sha;
  if (!silent) wsRender();
  return true;
}
function wsInDeliv(id) { return !!((state.deliv && state.deliv.items) || []).find(x => x.id === id); }

async function wsToggleDeliv(kind, id) {
  if (!hasSettings()) { showSettings(); return; }
  const p = wsProj(); if (!p) return;
  setSyncStatus('syncing', T('放入交付中…','Publishing…'));
  // 每次都先拉最新，避免覆盖别处的改动；**拉不到就停**，不要拿 null sha 去写
  if (!(await wsDelivLoad(true))) { setSyncStatus('error', state.delivErr); wsRender(); return; }
  const items = state.deliv.items;
  const at = items.findIndex(x => x.id === id);
  if (at >= 0) { items.splice(at, 1); }
  else { const it = delivBuild(p, kind, id); if (!it) return; items.push(it); }
  state.deliv.project = p.name;
  state.deliv.updatedAt = new Date().toISOString();
  const r = await delivPut(delivFile(p), state.deliv, state.delivSha,
    `deliver(${p.id}): ${at >= 0 ? '移出' : '放入'} ${id}`);
  if (!r.ok) {
    let m = r.status; try { m = (await r.json()).message || m; } catch(e) {}
    state.delivErr = delivWhy(r.status, m);
    setSyncStatus('error', state.delivErr); wsRender(); return;
  }
  state.delivSha = (await r.json()).content.sha;
  setSyncStatus('success', at >= 0 ? T('已移出交付','Removed') : T('已放入交付','Published'));
  wsRender();
}

// 交付里显示的名字可以和文档标题不同——给团队看的名字未必是自己归档用的名字
async function wsDelivRename(id) {
  const it = ((state.deliv && state.deliv.items) || []).find(x => x.id === id); if (!it) return;
  const name = prompt(T('这一件在链接里显示的名字','Name shown in the link'), it.title);
  if (name === null) return;
  const t = name.trim(); if (!t || t === it.title) return;
  const p = wsProj();
  setSyncStatus('syncing', T('改名中…','Renaming…'));
  if (!(await wsDelivLoad(true))) { setSyncStatus('error', state.delivErr); wsRender(); return; }
  const cur = state.deliv.items.find(x => x.id === id); if (!cur) return;
  cur.title = t; cur.renamed = true;
  state.deliv.updatedAt = new Date().toISOString();
  const r = await delivPut(delivFile(p), state.deliv, state.delivSha, `deliver(${p.id}): 改名 ${t}`);
  if (!r.ok) {
    let m = r.status; try { m = (await r.json()).message || m; } catch(e) {}
    state.delivErr = delivWhy(r.status, m); setSyncStatus('error', state.delivErr); wsRender(); return;
  }
  state.delivSha = (await r.json()).content.sha;
  setSyncStatus('success', T('已改名','Renamed')); wsRender();
}

async function wsDelivKeyReset() {
  if (!hasSettings()) { showSettings(); return; }
  const p = wsProj(); if (!p) return;
  if (state.delivKeys && state.delivKeys[p.id] &&
      !confirm(T('重置后旧链接立刻失效，确定？','Reset will invalidate the old link. Continue?'))) return;
  if (!(await wsDelivLoad(true))) { setSyncStatus('error', state.delivErr); wsRender(); return; }
  const key = Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
  state.delivKeys[p.id] = { key, label: p.name, updatedAt: new Date().toISOString() };
  const r = await delivPut('keys.json', state.delivKeys, state.delivKeysSha, `keys: 重置 ${p.id}`);
  if (!r.ok) {
    let m = r.status; try { m = (await r.json()).message || m; } catch(e) {}
    state.delivErr = delivWhy(r.status, m);
    setSyncStatus('error', state.delivErr); wsRender(); return;
  }
  state.delivKeysSha = (await r.json()).content.sha;
  setSyncStatus('success', T('新链接已生成','New link ready'));
  wsRender();
}
function wsDelivLink() {
  const p = wsProj(); if (!p) return '';
  const e = state.delivKeys && state.delivKeys[p.id];
  return e ? `${DELIV_SITE}/d?p=${encodeURIComponent(p.id)}&k=${e.key}` : '';
}
function wsCopyLink() {
  const l = wsDelivLink(); if (!l) return;
  navigator.clipboard.writeText(l).then(() => setSyncStatus('success', T('链接已复制','Link copied')));
}

// 字符级 diff 渲染成带颜色的 HTML（不是【+】【-】符号）
function wsDiffHtml(a, b) {
  return wsDiff(a, b).map(([op, t]) =>
    op === 0 ? escHtml(t) : op === 1 ? `<ins>${escHtml(t)}</ins>` : `<del>${escHtml(t)}</del>`).join('');
}
function wsDownload(name, text) {
  const type = /\.html?$/i.test(name) ? 'text/html;charset=utf-8'
             : /\.csv$/i.test(name) ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8';
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function wsStamp() { const d = new Date(); const p = n => String(n).padStart(2,'0');

function wsExportChecklist() {
  const p = wsProj(); const tasks = wsDelivTasks(p); const st = wsStats(p);
  const ST = { todo:'未写', draft:'草稿', done:'已定稿' };
  // 列宽 = 清单里最长的条目（标题+状态），中日文按 2 格算；字段内容在列内自动换行
  const w = str => [...String(str)].reduce((a,c) => a + (/[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(c) ? 2 : 1), 0);
  const maxW = tasks.reduce((m, t) => Math.max(m, w(t.title) + 6), 0);
  const colCh = Math.min(Math.max(maxW, 20), 58);   // 兜底：太窄不好读，太宽等于单列
  let body = `<header style="margin-bottom:18px"><div class="stats">
      <div class="stat"><b>${st.total}</b><span>条目</span></div>
      <div class="stat"><b>${st.done}</b><span>已定稿</span></div>
      <div class="stat"><b>${st.draft}</b><span>草稿</span></div>
      <div class="stat"><b>${st.todo}</b><span>未写</span></div>
    </div><div class="bar"><i style="width:${st.pct}%"></i></div>
    <div class="meta">完成度 ${st.pct}%</div></header>`;
  const groups = [...new Set(tasks.map(t => t.group))];
  for (const g of groups) {
    const gt = tasks.filter(t => t.group === g);
    body += `<h2>${escHtml(g)} <span class="pill">${gt.filter(t=>t.status==='done').length}/${gt.length}</span></h2>`;
    body += `<div class="cols" style="column-width:${colCh}ch">`;
    let sub = null;
    for (const t of gt) {
      if (t.sub !== sub) { body += `<h3>${escHtml(t.sub||'')}</h3>`; sub = t.sub; }
      const dn = t.status === 'done';
      body += `<div class="li"><span class="ck ${dn?'':'no'}">${dn?'☑':'☐'}</span>${escHtml(t.title)}` +
              `<span class="pill ${t.status}">${ST[t.status]}</span>`;
      for (const f of (t.fields||[])) if (f.value)
        body += `<div class="sub2">${escHtml(f.label)}：${escHtml(f.value)}</div>`;
      body += `</div>`;
    }
    body += `</div>`;
  }
  wsDownload(`${p.name}-交付清单-${wsStamp()}.html`, wsHtmlDoc(`${p.name}｜交付清单`, '', body));
}

  let csv = '﻿分组,子组,条目,状态,字段,内容\n';
  for (const t of wsDelivTasks(p)) {
    if (!(t.fields||[]).length) { csv += [t.group,t.sub,t.title,WS_STATUS[t.status],'',''].map(q).join(',') + '\n'; continue; }
    for (const f of t.fields) csv += [t.group,t.sub,t.title,WS_STATUS[t.status],f.label,f.value].map(q).join(',') + '\n';
  }
  wsDownload(`${p.name}-交付清单-${wsStamp()}.csv`, csv);
}

function wsExportDelivery(mark) {
  const p = wsProj();
  const ST = { todo:'未写', draft:'草稿', done:'已定稿' };
  const added = [], changed = [];
  for (const t of wsDelivTasks(p)) {
    if (!wsChanged(t)) continue;
    (t.exported ? changed : added).push(t);
  }
  const dels = p.deletedSinceExport || [];
  if (!added.length && !changed.length && !dels.length) {
    alert(T('自上次交付以来没有变化。','Nothing changed since the last delivery.')); return;
  }
  let body = `<div class="legend">
    对比基线：${p.lastExportAt ? new Date(p.lastExportAt).toLocaleString('zh-CN') : '（首次交付，全部视为新增）'}<br>
    变化标注：<ins>绿色</ins> ＝ 这次新增的字，<del>红色删除线</del> ＝ 这次删掉的字，未标注处没动过。
  </div>
  <header style="margin-bottom:22px"><div class="stats">
    <div class="stat"><b>${added.length}</b><span>新增</span></div>
    <div class="stat"><b>${changed.length}</b><span>修改</span></div>
    <div class="stat"><b>${dels.length}</b><span>删除</span></div>
  </div></header>`;

  const block = (t, isChg) => {
    let h = `<div class="item"><div class="t">${escHtml(t.title)}<span class="pill ${t.status}">${ST[t.status]}</span></div>`;
    h += `<div class="meta" style="color:var(--tx3);font-size:.8rem">${escHtml(t.group)} · ${escHtml(t.sub||'')}</div>`;
    for (const f of (t.fields||[])) {
      const oldV = (t.exported && t.exported[f.key]) || '', newV = f.value || '';
      if (isChg && oldV === newV) continue;
      if (!isChg && !newV) continue;
      h += `<div class="f"><div class="lb">${escHtml(f.label)}</div>`;
      if (isChg) {
        h += `<div class="vl oldv">${escHtml(oldV || '（原为空）')}</div>`;
        h += `<div class="vl" style="margin-top:4px">${escHtml(newV || '（已清空）')}</div>`;
        h += `<div class="diff">${wsDiffHtml(oldV, newV)}</div>`;
      } else {
        h += `<div class="vl">${escHtml(newV)}</div>`;
      }
      h += `</div>`;
    }
    return h + `</div>`;
  };

  if (added.length) {
    body += `<h2>🆕 新增（${added.length}）</h2>`;
    let g = null;
    for (const t of added) {
      if (t.group + t.sub !== g) { body += `<h3>${escHtml(t.group)} · ${escHtml(t.sub||'')}</h3>`; g = t.group + t.sub; }
      body += block(t, false);
    }
  }
  if (changed.length) {
    body += `<h2>✏️ 修改（${changed.length}）</h2>`;
    let g = null;
    for (const t of changed) {
      if (t.group + t.sub !== g) { body += `<h3>${escHtml(t.group)} · ${escHtml(t.sub||'')}</h3>`; g = t.group + t.sub; }
      body += block(t, true);
    }
  }
  if (dels.length) {
    body += `<h2>🗑 删除（${dels.length}）</h2>`;
    for (const d of dels) body += `<div class="li">${escHtml(d.title)} <span class="pill">${(d.at||'').slice(0,10)}</span></div>`;
  }

  wsDownload(`${p.name}-交付包-${wsStamp()}.html`,
    wsHtmlDoc(`${p.name}｜交付包`, `自上次交付以来的新增与修改`, body));

  if (mark) {
    const now = new Date().toISOString();
    for (const t of wsDelivTasks(p)) {
      const snap = {}; (t.fields||[]).forEach(f => snap[f.key] = f.value || '');
      t.exported = snap; t.exportedAt = now;
    }
    p.deletedSinceExport = [];
    p.lastExportAt = now;
    wsScheduleSave(); wsRender();
  }
}

function wsExportFull() {
  const p = wsProj();
  const ST = { todo:'未写', draft:'草稿', done:'已定稿' };
  const dts = wsDelivTasks(p);
  let body = `<div class="legend">所有已写的交付内容的完整快照，不做增量比对。</div>`;
  const groups = [...new Set(dts.map(t => t.group))];
  for (const g of groups) {
    const gt = dts.filter(x => x.group === g && (x.fields||[]).some(f => f.value));
    if (!gt.length) continue;
    body += `<h2>${escHtml(g)}</h2>`;
    let sub = null;
    for (const t of gt) {
      if (t.sub !== sub) { body += `<h3>${escHtml(t.sub||'')}</h3>`; sub = t.sub; }
      body += `<div class="item"><div class="t">${escHtml(t.title)}<span class="pill ${t.status}">${ST[t.status]}</span></div>`;
      for (const f of (t.fields||[])) if (f.value)
        body += `<div class="f"><div class="lb">${escHtml(f.label)}</div><div class="vl">${escHtml(f.value)}</div></div>`;
      body += `</div>`;
    }
  }
  wsDownload(`${p.name}-全量文案-${wsStamp()}.html`, wsHtmlDoc(`${p.name}｜全量文案`, '所有已写的交付内容', body));
}

function setCategory(cat) {
  state.category = cat;
  const info = CATEGORIES[cat];
  if (info.subs) {
    state.subtype = Object.keys(info.subs)[0];
  } else {
    state.subtype = null;
  }
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`cat-${cat}`).classList.add('active');
  renderSubNav();
  renderCards();
}

function setSubtype(sub) {
  state.subtype = sub;
  document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`sub-${sub}`).classList.add('active');
  renderCards();
}

function renderSubNav() {
  const nav = document.getElementById('sub-nav');
  const info = CATEGORIES[state.category];
  if (state.category === 'music') {
    // 音乐类：创作区（原三阶段看板）/ 歌词库 两个子页签
    nav.style.display = 'flex';
    nav.innerHTML = `
      <button class="sub-tab${state.musicView !== 'lyrics' ? ' active' : ''}" onclick="setMusicView('stages')">${T('🎵 创作区','🎵 Works')}</button>
      <button class="sub-tab${state.musicView === 'lyrics' ? ' active' : ''}" onclick="setMusicView('lyrics')">${T('🎼 歌词库','🎼 Lyrics')}</button>`;
    return;
  }
  if (!info.subs) {
    nav.innerHTML = '';
    nav.style.display = 'none';
    return;
  }
  nav.style.display = 'flex';
  nav.innerHTML = Object.keys(info.subs).map(key =>
    `<button class="sub-tab${key === state.subtype ? ' active' : ''}"
      id="sub-${key}" onclick="setSubtype('${key}')">${subLabel(state.category, key)}</button>`
  ).join('');
}

// ============================================================
function getStageData(stage) {
  const cat = state.category;
  const sub = state.subtype;
  if (sub) return state.data[cat][sub][stage];
  return state.data[cat][stage];
}

function renderCards() {
  const lyricsMode = state.category === 'music' && state.musicView === 'lyrics';
  document.getElementById('stage-area').style.display = lyricsMode ? 'none' : '';
  document.getElementById('lyrics-area').style.display = lyricsMode ? '' : 'none';
  if (lyricsMode) { renderLyrics(); return; }
  for (const stage of STAGES) {
    const items = getStageData(stage);
    const body = document.getElementById(`body-${stage}`);
    const count = document.getElementById(`count-${stage}`);
    count.textContent = items.length;

    const addBtn = `<button class="add-btn" onclick="openAdd('${stage}')">${T('＋ 新增','＋ New ')}${stageShort(stage)}</button>`;

    if (!items.length) {
      body.innerHTML = addBtn + `<div class="empty-state">${T('暂无内容<br>点击上方按钮添加','No items yet<br>Click the button above to add')}</div>`;
      continue;
    }

    const cards = items.map(item => renderCard(item, stage)).join('');
    body.innerHTML = addBtn + cards;
  }
  loadCardImages();
}

function renderAll() {
  renderSubNav();
  renderCards();
}

function renderCard(item, stage) {
  const tagsHtml = (item.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
  const date = item.updated_at ? new Date(item.updated_at).toLocaleDateString('zh-CN') : '';
  
  const prevStage = STAGES[STAGES.indexOf(stage) - 1];
  const nextStage = STAGES[STAGES.indexOf(stage) + 1];
  
  const promoteBtn = nextStage
    ? `<button class="card-action promote" onclick="moveItem('${item.id}','${stage}','${nextStage}')">→ ${stageShort(nextStage)}</button>`
    : '';
  const demoteBtn = prevStage
    ? `<button class="card-action demote" onclick="moveItem('${item.id}','${stage}','${prevStage}')">${T('← 退回','← Back')}</button>`
    : '';

  const imgHtml = item.image
    ? `<div class="card-img-wrap"><img class="card-img" data-img-path="${escHtml(item.image)}" src="" alt="${T('图片','image')}"></div>`
    : '';

  const selectable = state.selectMode ? ' selectable' : '';
  const selected = state.selectMode && state.selectedItems.has(item.id + '|' + stage) ? ' selected' : '';
  const clickHandler = state.selectMode
    ? `onclick="toggleSelectItem('${item.id}','${stage}',this)"`
    : '';
  const checkbox = state.selectMode
    ? `<span class="card-checkbox"></span>`
    : '';

  return `
  <div class="card${selectable}${selected}" id="card-${item.id}" ${clickHandler}>
    ${imgHtml}
    <div class="card-title-row">${checkbox}<span class="card-title">${escHtml(item.title || T('无标题','Untitled'))}</span>${item.public ? `<span class="public-badge">${T('公开','Public')}</span>` : ''}</div>
    ${item.content ? `<div class="card-content" id="cc-${item.id}">${escHtml(item.content)}</div>` : ''}
    ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
    ${(item.files && item.files.length) ? `<div class="card-files">${item.files.map(f =>
      `<span class="card-file-chip">${fileIcon(f.name)} ${escHtml(f.name)}</span>`).join('')}</div>` : ''}
    <div class="card-footer">
      <span class="card-date">${date}</span>
      <button class="card-action detail-btn" onclick="openDetail('${item.id}','${stage}');event.stopPropagation()">${T('详情','Details')}</button>
      <button class="card-action" onclick="openEdit('${item.id}','${stage}');event.stopPropagation()">${T('编辑','Edit')}</button>
      ${demoteBtn}
      ${promoteBtn}
      <button class="card-action danger" onclick="confirmDelete('${item.id}','${stage}');event.stopPropagation()">${T('删除','Delete')}</button>
    </div>
  </div>`;
}

function openDetail(id, stage) {
  // find item across all accessible stages
  let item = null;
  for (const s of STAGES) {
    const arr = getStageDataOf(state.category, state.subtype, s);
    const found = arr.find(i => i.id === id);
    if (found) { item = found; stage = s; break; }
  }
  if (!item) return;

  const cat = state.category;
  const sub = state.subtype;
  const catInfo = CATEGORIES[cat];
  const catLab = catLabel(cat);
  const subLab = sub && catInfo.subs ? subLabel(cat, sub) : '';
  const stageLabel = stageName(stage);

  const tagsHtml = (item.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
  const locale = lang === 'en' ? 'en-US' : 'zh-CN';
  const created = item.created_at ? new Date(item.created_at).toLocaleString(locale) : '';
  const updated = item.updated_at ? new Date(item.updated_at).toLocaleString(locale) : '';

  const prevStage = STAGES[STAGES.indexOf(stage) - 1];
  const nextStage = STAGES[STAGES.indexOf(stage) + 1];
  const promoteBtn = nextStage
    ? `<button class="btn btn-secondary" onclick="moveItem('${item.id}','${stage}','${nextStage}');closeAllModals()">${T('→ 移至','→ Move to ')}${stageName(nextStage)}</button>` : '';
  const demoteBtn = prevStage
    ? `<button class="btn btn-secondary" onclick="moveItem('${item.id}','${stage}','${prevStage}');closeAllModals()">${T('← 退回','← Back to ')}${stageName(prevStage)}</button>` : '';

  const imgSection = item.image
    ? `<div class="detail-img-wrap"><img class="detail-img" id="detail-img-el" src="" alt="${T('图片','image')}"></div>` : '';

  document.getElementById('modal-root').innerHTML = `
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal detail-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="flex:1">
          <div class="detail-breadcrumb">${catLab}${subLab ? ' › ' + subLab : ''} › ${stageLabel}</div>

      </div>
      <div class="detail-body">
        ${imgSection}
        ${item.content ? `<div class="detail-content">${escHtml(item.content)}</div>` : `<div class="detail-empty">${T('暂无内容','No content')}</div>`}
        ${tagsHtml ? `<div class="card-tags" style="margin-top:16px">${tagsHtml}</div>` : ''}
        ${(item.files && item.files.length) ? `
          <div style="margin-top:16px">
            <div class="dest-cat-label" style="margin-bottom:8px">${T('文件附件','Attachments')}</div>
            ${item.files.map((f,i) => `
              <div class="detail-file-item">
                <span class="file-icon">${fileIcon(f.name)}</span>
                <span class="file-name">${escHtml(f.name)}</span>
                <span class="file-size">${fileSizeStr(f.size)}</span>
                <button class="btn-download" onclick="downloadFile('${escHtml(f.path)}','${escHtml(f.name)}',this)">${T('⬇ 下载','⬇ Download')}</button>
              </div>`).join('')}
          </div>` : ''}
        <div class="detail-meta">
          ${created ? `<span>${T('创建：','Created: ')}${created}</span>` : ''}
          ${updated ? `<span>${T('更新：','Updated: ')}${updated}</span>` : ''}
        </div>
      </div>
      <div class="modal-footer">
        ${demoteBtn}
        ${promoteBtn}
        <span style="flex:1"></span>
        <button class="public-toggle-btn${item.public ? ' is-public' : ''}" id="pub-toggle-btn"
          onclick="togglePublicItem('${item.id}','${stage}',this)">
          ${item.public ? T('🌐 已公开','🌐 Public') : T('○ 设为公开','○ Make public')}
        </button>
        <button class="btn btn-secondary" onclick="closeAllModals();openEdit('${item.id}','${stage}')">${T('编辑','Edit')}</button>
        <button class="btn btn-secondary" onclick="closeAllModals()">${T('关闭','Close')}</button>
      </div>
    </div>
  </div>`;

  // load image async
  if (item.image) {
    const _imgPath = item.image;
    fetchImageResult(_imgPath).then(({ dataUrl, error }) => {
      const el = document.getElementById('detail-img-el');
      if (!el) return;
      if (dataUrl) {
        imageCache.set(_imgPath, dataUrl);
        el.src = dataUrl;
      } else {
        el.parentElement.innerHTML =
          '<div style="padding:12px;background:var(--bg3);border-radius:6px">' +
          '<div style="color:var(--accent2);font-size:0.85rem;margin-bottom:6px">' + T('⚠ 图片加载失败','⚠ Image failed to load') + '</div>' +

          '</div>';

    });
  }

function retryDetailImage(path) {
  imageCache.delete(path);
  const wrap = document.querySelector('.detail-img-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<img class="detail-img" id="detail-img-el" src="" alt="' + T('图片','image') + '">';
  fetchImageResult(path).then(({ dataUrl, error }) => {
    const el = document.getElementById('detail-img-el');
    if (!el) return;
    if (dataUrl) {
      imageCache.set(path, dataUrl);
      el.src = dataUrl;
    } else {
      wrap.innerHTML =
        '<div style="padding:12px;background:var(--bg3);border-radius:6px">' +
        '<div style="color:var(--accent2);font-size:0.85rem;margin-bottom:6px">' + T('⚠ 仍然失败','⚠ Still failing') + '</div>' +
        '<div style="color:var(--text3);font-size:0.75rem;font-family:Courier Prime,monospace;word-break:break-all">' + escHtml(error || '') + '</div>' +
        '</div>';
    }
  });
}

function getStageDataOf(cat, sub, stage) {
  if (sub) return state.data[cat][sub][stage];

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

              return `<button class="${cls}" onclick="selectStage(this,'${s}')" data-stage="${s}">${stageName(s)}</button>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAllModals()">${T('取消','Cancel')}</button>
        <button class="btn btn-primary" onclick="saveItem('${isEdit ? item.id : ''}', '${stage}')">
          ${isEdit ? T('保存修改','Save') : T('添加','Add')}
        </button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = modalHtml;
  document.getElementById('item-title').focus();
  renderModalFileList();
  // Load existing image preview if editing
  if (isEdit && item && item.image) {
    fetchImage(item.image).then(dataUrl => {
      const th = document.getElementById('modal-edit-thumb');
      if (th && dataUrl) th.src = dataUrl;
    });
  }
}

function selectStage(btn, stage) {
  document.querySelectorAll('.stage-opt').forEach(b => {
    b.className = 'stage-opt';
  });
  btn.className = `stage-opt active-${stage}`;
}

function getSelectedStage() {
  const active = document.querySelector('.stage-opt.active-ideas, .stage-opt.active-wip, .stage-opt.active-done');
  if (!active) return 'ideas';
  return active.dataset.stage;
}

function saveItem(existingId, originalStage) {
  const title = document.getElementById('item-title').value.trim();
  if (!title) { 
    document.getElementById('item-title').style.borderColor = 'var(--accent)';
    document.getElementById('item-title').focus();
    return; 
  }

  const content = document.getElementById('item-content').value.trim();
  const tagsRaw = document.getElementById('item-tags').value;
  const tags = tagsRaw.split(/[,，]/).map(t => t.trim()).filter(Boolean);
  const newStage = getSelectedStage();
  const now = new Date().toISOString();

  const cat = state.category;
  const sub = state.subtype;

  if (existingId) {
    let origItems = sub ? state.data[cat][sub][originalStage] : state.data[cat][originalStage];
    const idx = origItems.findIndex(i => i.id === existingId);
    if (idx === -1) { closeAllModals(); return; }
    const img = modalImagePath !== undefined ? modalImagePath : origItems[idx].image;
    const updated = { ...origItems[idx], title, content, tags, image: img || undefined, files: modalFiles.length ? modalFiles : undefined, updated_at: now };
    if (newStage === originalStage) {
      // Same stage: remove and re-insert at top (most recently edited = first)
      origItems.splice(idx, 1);
      origItems.unshift(updated);
    } else {
      // Stage changed: move to top of target stage
      origItems.splice(idx, 1);
      const destItems = sub ? state.data[cat][sub][newStage] : state.data[cat][newStage];
      destItems.unshift(updated);
    }
  } else {
    const newItem = { id: uuid(), title, content, tags, image: modalImagePath || undefined, files: modalFiles.length ? modalFiles : undefined, created_at: now, updated_at: now };
    let destItems = sub ? state.data[cat][sub][newStage] : state.data[cat][newStage];
    destItems.unshift(newItem);
  }

  closeAllModals();
  renderCards();
  scheduleSave();
}

function moveItem(id, fromStage, toStage) {
  const cat = state.category;
  const sub = state.subtype;
  const fromItems = sub ? state.data[cat][sub][fromStage] : state.data[cat][fromStage];
  const idx = fromItems.findIndex(i => i.id === id);
  if (idx === -1) return;
  const [item] = fromItems.splice(idx, 1);
  item.updated_at = new Date().toISOString();
  const toItems = sub ? state.data[cat][sub][toStage] : state.data[cat][toStage];
  toItems.unshift(item);
  renderCards();
  scheduleSave();
}

function confirmDelete(id, stage) {
  const items = getStageData(stage);
  const item = items.find(i => i.id === id);
  const title = item ? escHtml(item.title || T('此条目','this item')) : T('此条目','this item');
  const modalHtml = `
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal confirm-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">${T('确认删除','Confirm delete')}</div>
        <button aria-label="关闭" class="modal-close" onclick="closeAllModals()">×</button>
      </div>
      <div class="confirm-text">${T(`确定要删除「${title}」吗？此操作不可撤销。`,`Delete “${title}”? This cannot be undone.`)}</div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAllModals()">${T('取消','Cancel')}</button>
        <button class="btn btn-danger" onclick="deleteItem('${id}','${stage}')">${T('确认删除','Delete')}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = modalHtml;
}

function deleteItem(id, stage) {
  const cat = state.category;
  const sub = state.subtype;
  if (sub) {
    state.data[cat][sub][stage] = state.data[cat][sub][stage].filter(i => i.id !== id);
  } else {
    state.data[cat][stage] = state.data[cat][stage].filter(i => i.id !== id);
  }
  closeAllModals();
  renderCards();
  scheduleSave();
}

// ============================================================
// LYRICS VAULT（音乐类 · 歌词库：自定义分组 + AI 共性提取）
// 数据在 state.data.lyrics = { groups:[{id,name,analysis,analyzedAt,analyzedCount}],
//                              items:[{id,text,song,artist,note,groups:[gid],created_at,updated_at}] }
// 纯私人收藏：不参与「公开展示」导出（export 只遍历分类×阶段）。
// ============================================================
function LY() {
  if (!state.data.lyrics) state.data.lyrics = { groups: [], items: [] };
  if (!Array.isArray(state.data.lyrics.groups)) state.data.lyrics.groups = [];
  if (!Array.isArray(state.data.lyrics.items)) state.data.lyrics.items = [];
  return state.data.lyrics;
}

function setMusicView(v) {
  state.musicView = v;
  renderSubNav();
  renderCards();
}

function lyricGroupsOf(item) {
  const L = LY();
  return (item.groups || []).map(gid => L.groups.find(g => g.id === gid)).filter(Boolean);
}

function renderLyricCard(item) {
  const chips = lyricGroupsOf(item).map(g => `<span class="lyr-chip">${escHtml(g.name)}</span>`).join('');
  const src = [item.song, item.artist].filter(Boolean).map(escHtml).join(' · ');
  return `
  <div class="lyr-card" id="lyr-${item.id}">
    <div class="lyr-text">${escHtml(item.text)}</div>
    ${src ? `<div class="lyr-src">—— ${src}</div>` : ''}
    ${item.note ? `<div class="lyr-note">${escHtml(item.note)}</div>` : ''}

}

function renderLyricAnalysisBlock(g, count) {
  if (!g.analysis) return '';
  const date = g.analyzedAt ? new Date(g.analyzedAt).toLocaleDateString('zh-CN') : '';
  const stale = (g.analyzedCount != null && g.analyzedCount !== count)
    ? ` · <span class="lyr-stale">${T(`分析后内容有变化（当时 ${g.analyzedCount} 条 → 现在 ${count} 条），可重新分析`,`Group changed since analysis (${g.analyzedCount} → ${count}) — consider re-running`)}</span>` : '';
  return `
  <div class="lyr-analysis">
    <div class="lyr-analysis-meta">✨ ${T('AI 共性分析','AI analysis')} · ${date} · ${T(`基于 ${g.analyzedCount ?? '?'} 条`,`based on ${g.analyzedCount ?? '?'} lyrics`)}${stale}</div>
    <div class="lyr-analysis-body">${escHtml(g.analysis)}</div>
  </div>`;
}

function renderLyrics() {
  const L = LY();
  const area = document.getElementById('lyrics-area');
  const cfg = lyricAiCfg();

  // 分组区块：每个自定义分组一块；无归属（或分组已删）的进「未分组」
  const groupedIds = new Set(L.groups.map(g => g.id));
  const inGroup = gid => L.items.filter(it => (it.groups || []).includes(gid));
  const ungrouped = L.items.filter(it => !(it.groups || []).some(gid => groupedIds.has(gid)));

  const groupBlock = (g) => {
    const items = inGroup(g.id);
    const aiBtn = `<button class="card-action lyr-ai-btn" id="lyrai-${g.id}" onclick="analyzeLyricGroup('${g.id}')" ${items.length ? '' : 'disabled'}>✨ ${g.analysis ? T('重新分析','Re-analyze') : T('提取共性','Analyze')}</button>`;
    return `
    <div class="lyr-group">
      <div class="lyr-group-head">
        <span class="lyr-group-name">${escHtml(g.name)}</span>
        <span class="lyr-group-count">${items.length}</span>
        <span class="lyr-group-tools">
          ${aiBtn}
          <button class="card-action" onclick="renameLyricGroup('${g.id}')">${T('改名','Rename')}</button>
          <button aria-label="${T('删除这个歌词组','Delete lyric group')}" class="card-action danger" onclick="confirmDeleteLyricGroup('${g.id}')">✕</button>
        </span>
      </div>
      <div class="lyr-ai-err" id="lyrerr-${g.id}"></div>
      ${renderLyricAnalysisBlock(g, items.length)}
      ${items.length
        ? `<div class="lyr-grid">${items.map(renderLyricCard).join('')}</div>`
        : `<div class="lyr-empty">${T('这个分组还没有歌词——收藏歌词时勾选它即可','No lyrics here yet — tick this group when saving a lyric')}</div>`}
    </div>`;
  };

  area.innerHTML = `
  <div class="lyr-toolbar">
    <button class="btn btn-primary" onclick="showLyricModal()">＋ ${T('收藏歌词','Add lyric')}</button>
    <button class="btn btn-secondary" onclick="renameLyricGroup()">＋ ${T('新建分组','New group')}</button>
    <span class="lyr-summary">${T(`${L.items.length} 条歌词 · ${L.groups.length} 个分组`,`${L.items.length} lyrics · ${L.groups.length} groups`)}</span>
    <span style="flex:1"></span>
    <button class="btn btn-secondary" onclick="toggleLyricAiRow()">🔑 ${T('AI 设置','AI key')}</button>
  </div>
  <div class="lyr-ai-row" id="lyr-ai-row" style="display:none">
    <input class="form-input" type="password" id="lyr-ai-key" placeholder="Anthropic API Key（sk-ant-…）${cfg.key ? T('（已保存，留空不改）','(saved — leave blank to keep)') : ''}" autocomplete="off">
    <select class="form-input" id="lyr-ai-model" style="max-width:190px">
      <option value="claude-opus-4-8" ${cfg.model !== 'claude-sonnet-5' ? 'selected' : ''}>Opus 4.8${T('（推荐）',' (best)')}</option>
      <option value="claude-sonnet-5" ${cfg.model === 'claude-sonnet-5' ? 'selected' : ''}>Sonnet 5${T('（更省）',' (cheaper)')}</option>
    </select>
    <button class="btn btn-primary" onclick="saveLyricAiCfg()">${T('保存','Save')}</button>
    <span class="lyr-ai-hint">${cfg.key ? T('✓ AI 已就绪 · Key 只存本机浏览器','✓ Ready · key stays in this browser') : T('Key 只存本机浏览器，绝不进仓库','Key stays in this browser only')}</span>
  </div>
  ${L.groups.map(groupBlock).join('')}
  ${ungrouped.length ? `
    <div class="lyr-group lyr-group-none">
      <div class="lyr-group-head"><span class="lyr-group-name">${T('未分组','Ungrouped')}</span><span class="lyr-group-count">${ungrouped.length}</span></div>
      <div class="lyr-grid">${ungrouped.map(renderLyricCard).join('')}</div>
    </div>` : ''}
  ${(!L.groups.length && !L.items.length) ? `
    <div class="lyr-welcome">
      <div class="lyr-welcome-icon">🎼</div>
      <div>${T('把打动你的歌词收进来，按自己的方式分组——','Collect the lyrics that move you, group them your way —')}</div>
      <div>${T('然后让 AI 告诉你：这一组歌词的共同气质是什么。','then let AI tell you what they share.')}</div>
    </div>` : ''}`;
}

function addGroupInsideModal() {
  const inp = document.getElementById('lyr-f-newgroup');
  const name = (inp.value || '').trim();
  if (!name) return;
  const L = LY();
  if (L.groups.some(g => g.name === name)) { inp.value = ''; return; }
  const g = { id: uuid(), name, analysis: '', analyzedAt: '', analyzedCount: null };
  L.groups.push(g);
  scheduleSave();
  // 只刷新复选框区，保留已填内容与已勾选项；新分组自动勾上
  const box = document.getElementById('lyr-f-groups');
  const kept = new Set([...box.querySelectorAll('input[data-lyrg]:checked')].map(el => el.dataset.lyrg));
  kept.add(g.id);
  box.innerHTML = L.groups.map(gr => `
    <label class="lyr-gcheck"><input type="checkbox" data-lyrg="${gr.id}" ${kept.has(gr.id) ? 'checked' : ''}> ${escHtml(gr.name)}</label>`).join('');
  inp.value = '';
}

function saveLyric(existingId) {
  const text = (document.getElementById('lyr-f-text').value || '').trim();
  if (!text) { document.getElementById('lyr-f-text').focus(); return; }
  const groups = [...document.querySelectorAll('#lyr-f-groups input[data-lyrg]:checked')].map(el => el.dataset.lyrg);
  const fields = {
    text,
    song: (document.getElementById('lyr-f-song').value || '').trim(),
    artist: (document.getElementById('lyr-f-artist').value || '').trim(),
    note: (document.getElementById('lyr-f-note').value || '').trim(),
    groups,
    updated_at: new Date().toISOString()
  };
  const L = LY();
  if (existingId) {
    const it = L.items.find(i => i.id === existingId);
    if (it) Object.assign(it, fields);
  } else {
    L.items.unshift(Object.assign({ id: uuid(), created_at: new Date().toISOString() }, fields));
  }
  closeAllModals();
  renderCards();
  scheduleSave();
}

async function analyzeLyricGroup(groupId) {
  const L = LY();
  const g = L.groups.find(x => x.id === groupId);
  if (!g) return;
  const items = L.items.filter(it => (it.groups || []).includes(groupId));
  if (!items.length) return;
  const cfg = lyricAiCfg();
  const errEl = document.getElementById(`lyrerr-${groupId}`);
  if (!cfg.key) {
    const row = document.getElementById('lyr-ai-row');
    if (row) { row.style.display = ''; document.getElementById('lyr-ai-key').focus(); }
    if (errEl) errEl.textContent = T('请先在右上「🔑 AI 设置」里保存 Anthropic API Key','Save your Anthropic API key first (🔑 AI key, top right)');
    return;
  }
  const btn = document.getElementById(`lyrai-${groupId}`);
  const oldLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = T('✨ 分析中…','✨ Analyzing…'); }
  if (errEl) errEl.textContent = '';

  const SYSTEM = '你是歌词鉴赏与创作分析助手。用户给你一组 TA 收藏的歌词片段（同属一个自定义分组），请提炼这组歌词的共性与特点。要求：\n' +
    '1. 用简体中文，具体、不空泛；结合歌词原句举例（引用用「」）。\n' +
    '2. 按以下小节输出，每节 1-4 行，小节标题用【】：【主题与情感】【意象与画面】【语言与修辞】【节奏与结构】【共同的味道】（一两句话概括这组歌词为什么会被放进同一组）【可借鉴的写法】（给写歌词的人 2-3 条具体启发）。\n' +
    '3. 某一节若确实没有共性，写明"各异"并简述差异。直接输出正文，不要任何前后缀。';
  const userText = `分组名：「${g.name}」\n\n共 ${items.length} 条歌词：\n\n` + items.map((it, i) => {
    const src = [it.song, it.artist].filter(Boolean).join(' · ');
    return `【${i + 1}】${src ? `（${src}）` : ''}\n${it.text}${it.note ? `\n（收藏理由：${it.note}）` : ''}`;
  }).join('\n\n');

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': cfg.key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: cfg.model || 'claude-opus-4-8',
        max_tokens: 2500,
        system: SYSTEM,
        messages: [{ role: 'user', content: userText }]
      })
    });
    if (r.status === 401) throw new Error(T('API Key 无效或已过期 (401)','Invalid API key (401)'));
    if (r.status === 429) throw new Error(T('触发频率限制 (429)，稍后再试','Rate limited (429) — try again later'));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.stop_reason === 'refusal') throw new Error(T('模型拒绝了该请求','The model refused'));
    const tb = (j.content || []).find(b => b.type === 'text');
    if (!tb || !tb.text.trim()) throw new Error(T('未返回内容','Empty response'));
    g.analysis = tb.text.trim();
    g.analyzedAt = new Date().toISOString();
    g.analyzedCount = items.length;
    renderCards();
    scheduleSave();
  } catch (e) {
    const el = document.getElementById(`lyrerr-${groupId}`);
    if (el) el.textContent = T('分析失败：','Analysis failed: ') + e.message;
    if (btn) { btn.disabled = false; btn.textContent = oldLabel; }
  }
}

function showSettings() {
  const s = state.settings;
  const modalHtml = `
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">${T('⚙ 设置 GitHub 同步','⚙ GitHub Sync Settings')}</div>
        <button aria-label="关闭" class="modal-close" onclick="closeAllModals()">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-warning">
          ${T('⚠ 请使用 GitHub Fine-Grained Personal Access Token。','⚠ Use a GitHub Fine-Grained Personal Access Token.')}<br>
          ${T('权限要求：','Permission: ')}<strong>Contents: Read &amp; Write</strong>${T('（仅针对私有数据仓库）。',' (for your private data repo only).')}<br>
          ${T('Token 存储在本地 localStorage，不会上传。','The token is stored in local localStorage, never uploaded.')}
        </div>
        <div class="form-group">
          <label class="form-label">GitHub Token</label>
          <input class="form-input" type="password" id="cfg-token"
            placeholder="github_pat_xxxx..." value="${escHtml(s.token||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">${T('私有仓库 Owner','Private repo owner')}</label>
          <input class="form-input" id="cfg-owner" placeholder="your-github-username" value="${escHtml(s.owner||'')}">
        </div>
        <div class="form-group">
          <label class="form-label">${T('私有仓库名称','Private repo name')}</label>
          <input class="form-input" id="cfg-repo" placeholder="my-private-repo" value="${escHtml(s.repo||'')}">
          <span class="form-hint">${T('数据将保存为该仓库中的 writing.json 文件','Data is saved as writing.json in that repo')}</span>
        </div>
        <div id="settings-msg"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAllModals()">${T('取消','Cancel')}</button>
        <button class="btn btn-primary" onclick="applySettings()">${T('保存并测试连接','Save & test')}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = modalHtml;
}

async function applySettings() {
  const token = document.getElementById('cfg-token').value.trim();
  const owner = document.getElementById('cfg-owner').value.trim();
  const repo  = document.getElementById('cfg-repo').value.trim();
  const msgEl = document.getElementById('settings-msg');

  if (!token || !owner || !repo) {
    msgEl.innerHTML = `<div class="msg msg-error">${T('请填写所有字段','Please fill in all fields')}</div>`;
    return;
  }

  state.settings = { token, owner, repo };
  saveSettings();

  msgEl.innerHTML = `<div class="msg" style="background:var(--bg3);color:var(--text2)">${T('正在测试连接...','Testing connection...')}</div>`;

  // Test connection
  try {
    const r = await fetch(`${GITHUB_API}/repos/${owner}/${repo}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (r.status === 401) throw new Error(T('Token 无效或已过期','Token invalid or expired'));
    if (r.status === 404) throw new Error(T('仓库不存在或无访问权限','Repo not found or no access'));
    if (!r.ok) { const e = await r.json(); throw new Error(e.message || `HTTP ${r.status}`); }
    msgEl.innerHTML = `<div class="msg msg-success">${T('✓ 连接成功！正在加载数据...','✓ Connected! Loading data...')}</div>`;
    setTimeout(async () => {
      closeAllModals();
      await loadFromGitHub();
      renderAll();
    }, 1000);
  } catch(e) {
    msgEl.innerHTML = `<div class="msg msg-error">${T('✗ 连接失败：','✗ Connection failed: ')}${escHtml(e.message)}</div>`;
  }
}

// ============================================================
// MODAL HELPERS
// ============================================================
function closeModal(event) {
  if (event.target === event.currentTarget) closeAllModals();
}
function closeAllModals() {
  document.getElementById('modal-root').innerHTML = '';
}

// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllModals();
});

// ============================================================
// INIT
// ============================================================
async function init() {
  loadSettings();
  applyStatic();
  renderSubNav();

  try { state.zone = localStorage.getItem('writing_zone') || 'brain'; } catch(e) {}

  if (hasSettings()) {
    setSyncStatus('syncing', T('加载中...','Loading...'));
    await loadFromGitHub();
    renderCards();
  } else {
    setSyncStatus('idle', T('未配置','Not configured'));
    renderCards();
  }
  setZone(state.zone);
}

init();

/* ===== 可点击元素键盘可达性补丁 v2（toolbox/design-vault 模式 #26）=====
   为什么用运行时升级而不是改标记：这些元素多是模板字符串动态生成的，静态改 HTML 会漏掉动态节点。
   ⚠️ v2 修了 v1 的误伤（2026-08-05 实测：123 处里 26 处被 v1 错误升级）——
   并不是所有 [onclick] 都该变成按钮：
     · 纯 stopPropagation 的守卫：点了什么都不做，给它 role/tabindex 是造假；
     · 全屏遮罩层：正确做法是 Esc 关闭，给它 tabindex 会造出一个巨大的假停靠点。 */
(function(){
  var SEL = '[onclick]:not(button):not(a):not(input):not([role="button"])';

  function handlerOf(el){ return (el.getAttribute('onclick') || '').replace(/\s+/g,''); }

  function isGuard(el){                 // 只阻止冒泡，不做任何事
    var h = handlerOf(el);
    return /stopPropagation\(\)/.test(h) && h.replace(/^(event|e)\./,'').length <= 24;
  }

  function isOverlay(el){               // 全屏固定遮罩（按视口实测，不靠类名猜）
    var cs = window.getComputedStyle(el);
    if(cs.position !== 'fixed' && cs.position !== 'absolute') return false;
    var r = el.getBoundingClientRect();
    return r.width >= window.innerWidth * 0.9 && r.height >= window.innerHeight * 0.9;
  }

  function upgrade(root){
    (root || document).querySelectorAll(SEL).forEach(function(el){
      if(isGuard(el)) { el.setAttribute('data-a11y','guard'); return; }
      if(isOverlay(el)){ el.setAttribute('data-a11y','overlay'); return; }   // 交给 Esc
      el.setAttribute('role','button');
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    });
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){                       // 遮罩层：Esc 关闭
      var ov = document.querySelector('[data-a11y="overlay"]');
      if(ov){ e.preventDefault(); ov.click(); }
      return;
    }
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target;
    if(!t || !t.closest) return;
    var el = t.closest('[role="button"][onclick]');
    if(!el || el.tagName === 'BUTTON' || el.tagName === 'A') return;
    e.preventDefault();                           // 空格默认会滚动页面
    el.click();
  });

  if(document.body){
    upgrade();
    new MutationObserver(function(){ upgrade(); }).observe(document.body, {childList:true, subtree:true});
  }
})();
</script>
